<div id="disabled-attribute">
  <h3>Disabled</h3>
  <p>Disable the <code>&lt;much-select&gt;</code> with the <code>disabled</code> attribute.</p>
  <button type="button" id="disabled-attribute-toggle">Toggle disabled</button>
  <much-select disabled="disabled" multi-select selected-value="Red,Yellow">
    <select slot="select-input">
      <option>Red</option>
      <option>Yellow</option>
      <option>Blue</option>
      <option>Orange</option>
      <option>Green</option>
      <option>Purple</option>
    </select>
  </much-select>
  <script>
    const disabledToggle = document.querySelector("#disabled-attribute-toggle");
    const disabledMuchSelect = document.querySelector(
      "#disabled-attribute much-select",
    );

    disabledToggle.addEventListener("click", () => {
      disabledMuchSelect.toggleAttribute("disabled");
    });
  </script>
</div>
