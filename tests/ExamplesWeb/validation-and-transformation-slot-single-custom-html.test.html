<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, nextFrame, oneEvent } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("ExamplesWeb", () => {
          describe("validation-and-transformation-slot-single-custom-html", () => {
            it("uses allow-custom-options with transformation-validation slot", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options>
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": [
                        {
                          "name": "no-white-space",
                          "level": "error",
                          "message": "Spaces are not allow for custom fruit."
                        },
                        {
                          "name": "minimum-length",
                          "level": "silent",
                          "minimum-length": 3,
                          "message": "The minimum length is 3."
                        }
                      ]
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Apple</option>
                    <option>Pear</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");
              expect(await el.allowCustomOptions).to.be.true;
              expect(await el.outputStyle).to.equal("custom-html");
            });

            it("allows updating the transformation-validation slot at runtime", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options>
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Apple</option>
                    <option>Pear</option>
                  </select>
                </much-select>`,
              );
              await oneEvent(el, "muchSelectReady");

              const slot = el.querySelector(
                '[slot="transformation-validation"]',
              );
              slot.textContent = JSON.stringify({
                transformers: [{ name: "lowercase" }],
                validators: [
                  {
                    name: "minimum-length",
                    level: "silent",
                    "minimum-length": 3,
                    message: "The minimum length is 3.",
                  },
                ],
              });

              await nextFrame();
              expect(slot.textContent).to.include("minimum-length");
            });

            it("keeps regular option selection working", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options>
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Apple</option>
                    <option>Pear</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              const selected = oneEvent(el, "optionSelected");
              el.selectOption("Pear");

              const evt = await selected;
              expect(evt.detail.value).to.equal("Pear");
              expect(await el.selectedValue).to.equal("Pear");
            });
          });
        });
      });
    </script>
  </body>
</html>
