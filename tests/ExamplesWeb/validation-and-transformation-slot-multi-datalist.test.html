<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, oneEvent } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("ExamplesWeb", () => {
          describe("validation-and-transformation-slot-multi-datalist", () => {
            it("starts in multi-select datalist mode", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": [
                        {
                          "name": "no-white-space",
                          "level": "error",
                          "message": "Spaces are not allow for custom fruit."
                        },
                        {
                          "name": "minimum-length",
                          "level": "error",
                          "minimum-length": 3,
                          "message": "The minimum length is 3."
                        }
                      ]
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>African locust bean</option>
                    <option>Bilimbi</option>
                    <option>Carob</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");
              expect(await el.isInMultiSelectMode).to.be.true;
              expect(await el.outputStyle).to.equal("datalist");
            });

            it("loads slotted options with transformation-validation slot present", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>African locust bean</option>
                    <option>Bilimbi</option>
                    <option>Carob</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");
              const options = await el.getAllOptions();
              expect(options.map((option) => option.value)).to.include.members([
                "African locust bean",
                "Bilimbi",
                "Carob",
              ]);
            });

            it("supports selecting multiple existing options", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>African locust bean</option>
                    <option>Bilimbi</option>
                    <option>Carob</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              el.selectOption("Bilimbi");
              await oneEvent(el, "optionSelected");
              el.selectOption("Carob");
              await oneEvent(el, "optionSelected");

              const selected = await el.selectedValue;
              expect(selected).to.include.members(["Bilimbi", "Carob"]);
            });
          });
        });
      });
    </script>
  </body>
</html>
