<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, oneEvent, waitUntil } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("ExamplesWeb", () => {
          describe("update-options-add-options-to-a-much-select", () => {
            it("updateOptions replaces existing options", async () => {
              const el = /** @type {MuchSelect} */ await fixture(html`<much-select></much-select>`);
              await oneEvent(el, "muchSelectReady");

              el.addOption({ value: "first" });
              await waitUntil(async () => (await el.getAllOptions()).some((o) => o.value === "first"));

              el.updateOptions([{ value: 1001 }, { value: 1002 }, { value: 1003 }]);

              await waitUntil(async () => {
                const options = await el.getAllOptions();
                return options.some((o) => o.value === "1001") && !options.some((o) => o.value === "first");
              }, "Expected updateOptions to replace prior options");
            });

            it("selected option is preserved when updateOptions replaces list", async () => {
              const el = /** @type {MuchSelect} */ await fixture(html`<much-select></much-select>`);
              await oneEvent(el, "muchSelectReady");

              el.addOption({ value: "preserve-me" });
              await waitUntil(async () => (await el.getAllOptions()).some((o) => o.value === "preserve-me"));
              el.selectOption({ value: "preserve-me" });

              await waitUntil(async () => (await el.selectedValue) === "preserve-me");

              el.updateOptions([{ value: "new-a" }, { value: "new-b" }]);

              await waitUntil(async () => {
                const options = await el.getAllOptions();
                return options.some((o) => o.value === "preserve-me")
                  && options.some((o) => o.value === "new-a");
              }, "Expected selected option to remain after updateOptions");
            });

            it("emits optionsUpdated event with optionsReplaced=true for updateOptions", async () => {
              const el = /** @type {MuchSelect} */ await fixture(html`<much-select></much-select>`);
              await oneEvent(el, "muchSelectReady");

              const updated = oneEvent(el, "optionsUpdated");
              el.updateOptions([{ value: 3001 }, { value: 3002 }]);

              const evt = await updated;
              expect(evt.detail.optionsReplaced).to.be.true;
              expect(evt.detail.optionsUpdated).to.be.false;
            });
          });
        });
      });
    </script>
  </body>
</html>
