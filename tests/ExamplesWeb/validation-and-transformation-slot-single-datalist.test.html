<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, oneEvent } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("ExamplesWeb", () => {
          describe("validation-and-transformation-slot-single-datalist", () => {
            it("initializes in datalist mode with custom options enabled", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": [
                        {
                          "name": "no-white-space",
                          "level": "error",
                          "message": "Spaces are not allow for custom fruit."
                        },
                        {
                          "name": "minimum-length",
                          "level": "silent",
                          "minimum-length": 3,
                          "message": "The minimum length is 3."
                        }
                      ]
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Achacha</option>
                    <option>Ackee</option>
                    <option>Durian</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");
              expect(await el.outputStyle).to.equal("datalist");
              expect(await el.allowCustomOptions).to.be.true;
            });

            it("loads slotted options in datalist mode", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Achacha</option>
                    <option>Ackee</option>
                    <option>Durian</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              const options = await el.getAllOptions();
              expect(options.map((option) => option.value)).to.include.members([
                "Achacha",
                "Ackee",
                "Durian",
              ]);
            });

            it("still supports normal option selection with transformation slot present", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select allow-custom-options output-style="datalist">
                  <script
                    type="application/json"
                    slot="transformation-validation"
                  >
                    {
                      "transformers": [{ "name": "lowercase" }],
                      "validators": []
                    }
                  <\/script>
                  <select slot="select-input">
                    <option>Achacha</option>
                    <option>Ackee</option>
                    <option>Durian</option>
                  </select>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              const selected = oneEvent(el, "optionSelected");
              el.selectOption("Ackee");

              const evt = await selected;
              expect(evt.detail.value).to.equal("Ackee");
              expect(await el.selectedValue).to.equal("Ackee");
            });
          });
        });
      });
    </script>
  </body>
</html>
