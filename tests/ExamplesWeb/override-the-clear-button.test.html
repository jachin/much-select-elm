<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, oneEvent, waitUntil } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("ExamplesWeb", () => {
          describe("override-the-clear-button", () => {
            it("renders the clear-button slot override", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select selected-value="Blue">
                  <select slot="select-input">
                    <option>Red</option>
                    <option>Yellow</option>
                    <option>Blue</option>
                    <option>Orange</option>
                    <option>Green</option>
                    <option>Purple</option>
                  </select>
                  <div slot="clear-button">✿</div>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              const clearButtonSlot = el.shadowRoot.querySelector(
                'slot[name="clear-button"]',
              );
              const assigned = clearButtonSlot.assignedElements({ flatten: true });

              expect(assigned.length).to.equal(1);
              expect(assigned[0].textContent.trim()).to.equal("✿");
            });

            it("clicking the clear button wrapper still clears values", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select selected-value="Blue">
                  <select slot="select-input">
                    <option>Red</option>
                    <option>Yellow</option>
                    <option>Blue</option>
                    <option>Orange</option>
                    <option>Green</option>
                    <option>Purple</option>
                  </select>
                  <div slot="clear-button">✿</div>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              const cleared = oneEvent(el, "valueCleared");

              el.shadowRoot.getElementById("clear-button-wrapper").click();

              await cleared;

              await waitUntil(async () => {
                const selectedValue = await el.selectedValue;
                return Array.isArray(selectedValue) && selectedValue.length === 0;
              }, "Expected selected values to be cleared");
            });

            it("starts with Blue selected", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select selected-value="Blue">
                  <select slot="select-input">
                    <option>Red</option>
                    <option>Yellow</option>
                    <option>Blue</option>
                    <option>Orange</option>
                    <option>Green</option>
                    <option>Purple</option>
                  </select>
                  <div slot="clear-button">✿</div>
                </much-select>`,
              );

              await oneEvent(el, "muchSelectReady");

              expect(await el.selectedValue).to.eql(["Blue"]);
            });
          });
        });
      });
    </script>
  </body>
</html>
