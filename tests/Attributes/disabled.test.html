<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, nextFrame, waitUntil } from "@open-wc/testing";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        // Putting guard rails around this because browsers do not like
        //  having the same custom element defined more than once.
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("Attributes", () => {
          describe("disabled", () => {
            it("the default value should be false", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select></much-select>`,
              );
              expect(await el.disabled).to.be.false;
            });

            it("setting an empty attribute should set it to true", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select disabled></much-select>`,
              );
              expect(await el.disabled).to.be.true;
            });

            it("removing the attribute should set it to false", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select disabled></much-select>`,
              );
              el.removeAttribute("disabled");
              await nextFrame();
              expect(await el.disabled).to.be.false;
              expect(el.shadowRoot.querySelector("#value-casing.disabled")).to
                .be.null;
            });

            it("using the setter should set it to true", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select></much-select>`,
              );
              el.disabled = true;
              await nextFrame();
              expect(await el.disabled).to.be.true;
              const valueCasing = el.shadowRoot.querySelector("#value-casing");
              expect(valueCasing.classList.contains("disabled")).to.be.true;
              expect(valueCasing.getAttribute("aria-disabled")).to.equal("true");
              expect(getComputedStyle(valueCasing).opacity).to.equal("0.65");

              el.disabled = false;
              await nextFrame();
              expect(await el.disabled).to.be.false;
              expect(valueCasing.classList.contains("disabled")).to.be.false;
              expect(valueCasing.hasAttribute("aria-disabled")).to.be.false;
            });

            it("prevents mouse and keyboard interactions while disabled", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select
                  disabled
                  multi-select
                  output-style="custom-html"
                  selected-value="Red,Yellow"
                >
                  <select slot="select-input">
                    <option>Red</option>
                    <option>Yellow</option>
                    <option>Blue</option>
                  </select>
                </much-select>`,
              );
              await nextFrame();
              const valueCasing = el.shadowRoot.querySelector("#value-casing");
              valueCasing
                .querySelector(".selected-value-label")
                .dispatchEvent(
                  new MouseEvent("mouseup", { bubbles: true }),
                );
              valueCasing.dispatchEvent(
                new KeyboardEvent("keydown", { key: "Backspace", bubbles: true }),
              );
              await nextFrame();
              expect(await el.selectedValue).to.eql(["Red", "Yellow"]);
              expect(valueCasing.querySelector(".highlighted-value")).to.be
                .null;
            });

            it("closes an open dropdown and keeps it closed after re-enabling", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select multi-select output-style="custom-html">
                  <select slot="select-input">
                    <option>Red</option>
                    <option>Yellow</option>
                    <option>Blue</option>
                  </select>
                </much-select>`,
              );
              await nextFrame();

              el.shadowRoot.querySelector("#input-filter").focus();
              await waitUntil(
                () => el.shadowRoot.querySelector("#dropdown.showing") !== null,
              );

              el.setAttribute("disabled", "");
              await waitUntil(
                () => el.shadowRoot.querySelector("#value-casing.disabled") !== null,
              );
              expect(el.shadowRoot.querySelector("#dropdown")).to.be.null;

              el.removeAttribute("disabled");
              await waitUntil(
                () => el.shadowRoot.querySelector("#value-casing.disabled") === null,
              );
              expect(el.shadowRoot.querySelector("#dropdown.showing")).to.be
                .null;
            });

            it("disabled-options example should not allow selecting disabled options", async () => {
              const el = /** @type {MuchSelect} */ await fixture(
                html`<much-select>
                  <select slot="select-input">
                    <option>Red</option>
                    <option disabled>Yellow</option>
                    <option>Blue</option>
                    <option disabled>Orange</option>
                  </select>
                </much-select>`,
              );

              el.selectOption("Yellow");
              await nextFrame();
              expect(await el.selectedValue).to.not.equal("Yellow");

              el.selectOption("Blue");
              await nextFrame();
              expect(await el.selectedValue).to.equal("Blue");
            });
          });
        });
      });
    </script>
  </body>
</html>
