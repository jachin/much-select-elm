<!doctype html>
<html lang="en">
  <body>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { html, fixture, nextFrame, oneEvent } from "@open-wc/testing";
      import { sendKeys } from "@web/test-runner-commands";

      import MuchSelect from "../../dist/much-select-debug.js";

      if (!customElements.get("much-select")) {
        // Putting guard rails around this because browsers do not like
        //  having the same custom element defined more than once.
        window.customElements.define("much-select", MuchSelect);
      }

      runTests(() => {
        describe("Dropdown Highlighted Option", () => {
          it("when the dropdown is opened there should be no highlighted options", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select>
                <select slot="select-input">
                  <option value="Coffee">Coffee</option>
                  <option value="Tea">Tea</option>
                  <option value="Water">Water</option>
                  <option value="Soda">Soda</option>
                </select>
              </much-select>`,
            );

            // Focus on the input filter so the dropdown opens.
            el.shadowRoot.querySelector("#input-filter").focus();

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.highlighted")
                .length,
            ).to.equal(0);
          });

          it("when the dropdown is opened there should be no highlighted options even if an option is selected", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select>
                <select slot="select-input">
                  <option value="Coffee">Coffee</option>
                  <option selected value="Tea">Tea</option>
                  <option value="Water">Water</option>
                  <option value="Soda">Soda</option>
                </select>
              </much-select>`,
            );

            await oneEvent(el, "muchSelectReady");

            // Focus on the input filter so the dropdown opens.
            el.shadowRoot.querySelector("#input-filter").focus();

            await nextFrame();

            expect(
              el.shadowRoot
                .getElementById("dropdown")
                .classList.contains("showing"),
            ).to.be.true;

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option").length,
            ).to.equal(4);

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.highlighted")
                .length,
            ).to.equal(0);

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.selected")
                .length,
            ).to.equal(1);
          });

          it("when the dropdown is opened pressing the down arrow should highlight the first option", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select option-sorting="no-sorting">
                <select slot="select-input">
                  <option value="Coffee">Coffee</option>
                  <option value="Tea">Tea</option>
                  <option value="Water">Water</option>
                  <option value="Soda">Soda</option>
                </select>
              </much-select>`,
            );

            await oneEvent(el, "muchSelectReady");

            // Focus on the input filter so the dropdown opens.
            el.shadowRoot.querySelector("#input-filter").focus();

            await oneEvent(el, "muchSelectFocused");

            await sendKeys({ press: "ArrowDown" });

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.highlighted")
                .length,
            ).to.equal(1);

            expect(
              el.shadowRoot.querySelector("#dropdown .option.highlighted"),
            ).to.have.text("Coffee");
          });

          it("when the dropdown is opened pressing the down arrow should highlight the selected value", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select option-sorting="no-sorting">
                <select slot="select-input">
                  <option value="Coffee">Coffee</option>
                  <option value="Tea">Tea</option>
                  <option selected value="Water">Water</option>
                  <option value="Soda">Soda</option>
                </select>
              </much-select>`,
            );
            await oneEvent(el, "muchSelectReady");

            // Focus on the input filter so the dropdown opens.
            el.shadowRoot.querySelector("#input-filter").focus();
            await oneEvent(el, "muchSelectFocused");

            await sendKeys({ press: "ArrowDown" });

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.highlighted")
                .length,
            ).to.equal(1);

            expect(
              el.shadowRoot.querySelector("#dropdown .option.highlighted"),
            ).to.have.text("Water");
          });

          it("when the dropdown is opened pressing the arrows keys should only result in 1 highlighted option", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select option-sorting="no-sorting">
                <select slot="select-input">
                  <option value="Coffee">Coffee</option>
                  <option value="Tea">Tea</option>
                  <option selected value="Water">Water</option>
                  <option value="Soda">Soda</option>
                </select>
              </much-select>`,
            );
            await oneEvent(el, "muchSelectReady");

            // Focus on the input filter so the dropdown opens.
            el.shadowRoot.querySelector("#input-filter").focus();
            await oneEvent(el, "muchSelectFocused");

            await sendKeys({ press: "ArrowDown" });

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll(
                "#dropdown .option.selected.highlighted",
              ).length,
            ).to.equal(1);

            await sendKeys({ press: "ArrowUp" });

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.highlighted")
                .length,
            ).to.equal(1);

            await sendKeys({ press: "ArrowUp" });

            await nextFrame();

            expect(
              el.shadowRoot.querySelectorAll("#dropdown .option.selected")
                .length,
            ).to.equal(1);
          });

          it("search-keyboard-events example should emit inputKeyUp and inputKeyUpDebounced", async () => {
            const el = /** @type {MuchSelect} */ await fixture(
              html` <much-select>
                <select slot="select-input">
                  <option>Frodo</option>
                  <option>Sam</option>
                  <option>Merry</option>
                  <option>Pippin</option>
                </select>
              </much-select>`,
            );

            const input = el.shadowRoot.querySelector("#input-filter");
            input.focus();
            await oneEvent(el, "muchSelectFocused");

            const keyUp = oneEvent(el, "inputKeyUp");
            const keyUpDebounced = oneEvent(el, "inputKeyUpDebounced");

            await sendKeys({ type: "f" });

            const keyUpEvt = await keyUp;
            const keyUpDebouncedEvt = await keyUpDebounced;

            expect(keyUpEvt.detail.searchString).to.equal("f");
            expect(keyUpDebouncedEvt.detail.searchString).to.equal("f");
          });
        });
      });
    </script>
  </body>
</html>
